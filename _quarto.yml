project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - guide.qmd
    - theorems/*.qmd
  # 站点主体在 site/（纯静态：首页 + 笔记页）。
  # 渲染结束后用 site/ 覆盖 _site/，现有的发布流程不用改就能上线 site/ 的内容。
  post-render:
    - 'bash -c "rm -rf _site && mkdir -p _site && cp -r site/. _site/"'

lang: zh

website:
  title: "证明札记"
  search: true
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: 定理与引理
      - section: 笔记
        contents:
          - auto: theorems
      - href: guide.qmd
        text: 阅读与写作

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: 本页目录
    toc-depth: 3
    number-sections: false
    html-math-method: mathjax
    anchor-sections: true
    link-external-newwindow: true
    fontsize: 18px
    linestretch: 1.8
