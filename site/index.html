<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Junjie Chen</title>
<style>
:root{--paper:#fbfaf6;--paper2:#f3f0e8;--ink:#1a1917;--soft:#3d3a34;--muted:#78726a;
--faint:#a49d92;--rule:#e4dfd3;--rule2:#cec7b7;--accent:#9a3b2c;--tint:rgba(154,59,44,.045);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--soft);font-family:"Source Serif 4",Georgia,serif;
font-size:16.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:underline;text-underline-offset:.2em;text-decoration-color:rgba(154,59,44,.3)}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.8rem}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:2rem;position:sticky;top:0;z-index:9;
background:rgba(251,250,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
padding:1rem 1.8rem;font-family:system-ui,sans-serif}
.brand{font-size:.95rem;letter-spacing:.18em;font-weight:600;color:var(--ink);text-decoration:none}
.topnav nav{display:flex;gap:1.4rem;font-size:.74rem;letter-spacing:.12em;margin-left:auto}
.topnav nav a{color:var(--muted);text-decoration:none}
.topnav nav a:hover{color:var(--accent)}
.topnav nav button{font:inherit;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;letter-spacing:inherit}
.topnav nav button:hover{color:var(--accent)}
.hero{padding:5.5rem 0 3.5rem}
.hero h1{margin:0 0 .9rem;font-size:clamp(2.6rem,6vw,4rem);letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:1rem;max-width:30rem}
section{padding:3.2rem 0;border-top:1px solid var(--rule)}
.shead{display:flex;align-items:baseline;gap:.9rem;margin-bottom:1.7rem}
.snum{font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.12em;color:var(--accent)}
.shead h2{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.shead span.note{margin-left:auto;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--faint)}
.group{margin:1.6rem 0 0}
.glabel{display:flex;align-items:center;gap:.75rem;font-family:system-ui,sans-serif;font-size:1.06rem;
font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:2.3rem 0 .85rem}
.glabel::before{content:"";width:22px;height:2px;background:var(--accent);flex:none}
.glabel:first-child{margin-top:.2rem}
.row{display:flex;align-items:baseline;gap:1rem;padding:.62rem 0;border-bottom:1px solid var(--rule);
text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row:hover .t{color:var(--accent)}
.row .t{font-size:1rem;color:var(--ink);transition:color .15s}
.row .meta{margin-left:auto;font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.1em;color:var(--faint)}
.row .arrow{color:var(--faint);font-size:.8rem}
.row:hover .arrow{color:var(--accent)}
.empty{font-size:.9rem;color:var(--faint);padding:.5rem 0}
.about p{margin:0 0 .5rem;color:var(--muted);font-size:.95rem}
.about a{text-decoration:none;border-bottom:1px solid rgba(154,59,44,.28)}
footer{max-width:46rem;margin:0 auto;padding:2.6rem 1.8rem 4rem;color:var(--faint);
font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.06em}
.crumb{font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
color:var(--faint);margin:2.6rem 0 1.4rem}
.crumb a{color:var(--muted);text-decoration:none}
.crumb span{margin:0 .55rem;color:var(--rule2)}
main.article{max-width:44rem;margin:0 auto;padding:0 1.8rem 6rem}
.article h1{font-size:2rem;margin:.4rem 0 1.2rem;line-height:1.25;color:var(--ink)}
.article h2{font-size:1.3rem;margin:2.5rem 0 1rem;padding-bottom:.4rem;border-bottom:1px solid var(--rule);color:var(--ink)}
.article h3{font-size:1.06rem;margin:1.8rem 0 .6rem;color:var(--ink)}
.article p{margin:0 0 1.05rem;text-align:justify}
.header-section-number{font-family:system-ui,sans-serif;font-size:.78em;color:var(--faint);margin-right:.5em}
.stmt{margin:1.7rem 0;padding:1rem 1.3rem;border-left:2px solid var(--rule2)}
.stmt-theorem,.stmt-lemma,.stmt-proposition,.stmt-corollary{border-left-color:var(--accent);background:var(--tint)}
.stmt-definition{border-left-color:#35506f;background:rgba(53,80,111,.045)}
.stmt-head{display:flex;gap:.5rem;align-items:baseline;margin-bottom:.6rem;font-family:system-ui,sans-serif}
.stmt-kind{font-size:.74rem;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.stmt-num{font-size:.78rem;font-weight:600;color:var(--muted)}
.stmt-theorem .stmt-kind,.stmt-theorem .stmt-num,.stmt-lemma .stmt-kind,.stmt-lemma .stmt-num{color:var(--accent)}
.stmt>p:last-child{margin-bottom:0}
.proof{margin:1.1rem 0 1.8rem;padding-left:1.2rem;border-left:1px solid var(--rule)}
.proof-head{font-family:system-ui,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.2em;color:var(--faint);margin-bottom:.5rem}
.eq{text-align:center;margin:1.4rem 0}.eq p{text-align:center;margin:0}
a.xref{text-decoration:none;border-bottom:1px solid rgba(154,59,44,.3)}
.math-source{margin:0 .05em}
.math-source.katex-display{margin:1.4rem 0;overflow-x:auto;overflow-y:hidden}
.katex{font-size:1.04em}

/* make4ht 输出的排版映射 */
/* pandoc 生成的定理块 */
.proposition,.lemma,.theorem,.corollary{margin:1.7rem 0;padding:1rem 1.3rem;border-left:2px solid var(--accent);background:var(--tint)}
.definition{margin:1.7rem 0;padding:1rem 1.3rem;border-left:2px solid #35506f;background:rgba(53,80,111,.045)}
.example,.remark{margin:1.7rem 0;padding:1rem 1.3rem;border-left:2px solid var(--rule2)}
.proposition p,.lemma p,.theorem p,.definition p,.example p,.remark p{margin:0 0 .6rem}
.proposition p:last-child,.lemma p:last-child,.theorem p:last-child,.definition p:last-child,
.example p:last-child,.remark p:last-child{margin-bottom:0}
.proof{margin:1.1rem 0 1.8rem;padding-left:1.2rem;border-left:1px solid var(--rule)}
.newtheorem{margin:1.6rem 0;padding:1rem 1.3rem;border-left:2px solid var(--rule2)}
.newtheorem .head{display:block;margin-bottom:.45rem;font-family:system-ui,sans-serif;font-size:.8rem;
font-weight:700;letter-spacing:.08em;color:var(--accent)}
.cmbx-12,.cmbx-10,.cmbx-9,.cmbx-8{font-weight:600}
.cmti-12,.cmti-10,.cmti-9,.cmti-8,.cmsl-12{font-style:italic}
.qopname{font-style:normal}
.titlemark{display:none}
h3.sectionHead{font-size:1.7rem;margin:0 0 1.2rem;padding-bottom:.5rem;border-bottom:1px solid var(--rule);color:var(--ink)}
h4.subsectionHead{font-size:1.22rem;margin:2.2rem 0 .8rem;font-weight:600;color:var(--ink)}
h5.subsubsectionHead{font-size:1.05rem;margin:1.8rem 0 .6rem;font-weight:600;color:var(--ink)}
.article p.noindent,.article p.indent{margin:0 0 1.05rem}
.article img{max-width:100%;height:auto;display:block;margin:1.4rem auto}
.article .newtheorem p:last-child{margin-bottom:0}

.pdf-meta{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted);margin:0 0 1rem}
.pdf-view{width:100%;height:78vh;border:1px solid var(--rule);border-radius:6px;background:var(--paper2)}
.pdf-fallback{font-size:.9rem;color:var(--muted);padding:1rem}
@media(max-width:760px){.pdf-view{height:65vh}}
@media(max-width:640px){.topnav{padding:.9rem 1.2rem}.topnav nav{gap:.9rem;font-size:.68rem}
.hero{padding:3.4rem 0 2.4rem}.row .meta{display:none}}
</style></head><body>
<header class="topnav"><nav><a href="index.html#note">Note</a><button id="egg" type="button" title="彩蛋" aria-label="彩蛋">???</button></nav></header>

<div class="wrap">
  <div class="hero"><h1>Notes</h1></div>
  <section id="note">
    <div class="group"><p class="glabel">Algebraic Geometry</p><a class="row" href="notes/hartshorne-2-6.html"><span class="t">Hartshorne 2.6</span><span class="arrow">↗</span></a><a class="row" href="notes/hartshorne-2-7.html"><span class="t">Hartshorne 2.7</span><span class="arrow">↗</span></a><a class="row" href="notes/hartshorne-2-8.html"><span class="t">Hartshorne 2.8</span><span class="arrow">↗</span></a><a class="row" href="notes/hurwitz.html"><span class="t">Hurwitz</span><span class="arrow">↗</span></a></div><div class="group"><p class="glabel">Birational Geometry</p><a class="row" href="notes/nonvanishing-bpf.html"><span class="t">Nonvanishing and bpf</span><span class="arrow">↗</span></a><a class="row" href="notes/negativity.html"><span class="t">Negativity Lemma</span><span class="arrow">↗</span></a></div>
  </section>
</div>

<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;z-index:9998"></canvas>
<div id="fx-flash" style="position:fixed;inset:0;pointer-events:none;z-index:9997;opacity:0;
  background:radial-gradient(circle at 50% 42%, rgba(255,246,214,.95) 0%, rgba(255,214,140,.45) 22%,
  rgba(255,255,255,0) 62%);transition:opacity .5s ease-out"></div>
<script>
(function () {
  var btn = document.getElementById("egg");
  var cv = document.getElementById("fx");
  var flash = document.getElementById("fx-flash");
  if (!btn || !cv) return;

  // 手机/触屏：粒子减半、光晕减一层、不再抖页面
  var small = window.matchMedia("(max-width: 760px)").matches ||
              ("ontouchstart" in window && window.innerWidth < 900);
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var ctx = cv.getContext("2d");

  function size() {
    cv.width = window.innerWidth * DPR;
    cv.height = window.innerHeight * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  size();
  window.addEventListener("resize", size);
  window.addEventListener("orientationchange", function () { setTimeout(size, 250); });

  var PALETTE = [
    ["#e0245e", "#ff8fb1"], ["#f4b400", "#ffe98a"], ["#1b6ca8", "#8ec9f0"],
    ["#7b2ff7", "#cfaeff"], ["#0f9d58", "#9be7bd"], ["#ff6d00", "#ffc48a"]
  ];
  var parts = [], rings = [], running = false;
  var MAX_PARTS = small ? 700 : 2200;

  function burst(x, y, count, power) {
    if (parts.length > MAX_PARTS) return;
    var pair = PALETTE[(Math.random() * PALETTE.length) | 0];
    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 * i) / count + Math.random() * 0.14;
      var sp = power * (0.3 + Math.random());
      parts.push({
        x: x, y: y, px: x, py: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.004 + Math.random() * 0.005,
        c: pair[(Math.random() < 0.75) ? 0 : 1],
        r: (small ? 1.8 : 2.2) + Math.random() * (small ? 2.2 : 3.2)
      });
    }
    rings.push({ x: x, y: y, r: 8, life: 1, c: pair[0] });
    if (!small) rings.push({ x: x, y: y, r: 2, life: 1, c: pair[1] });
  }

  function tick() {
    var W = window.innerWidth, H = window.innerHeight;
    ctx.clearRect(0, 0, W, H);

    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.05;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }

      var alpha = Math.max(p.life, 0);

      if (!small) {
        ctx.globalAlpha = alpha * 0.18;
        ctx.strokeStyle = p.c;
        ctx.lineWidth = p.r * 4.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      ctx.globalAlpha = alpha;
      ctx.lineWidth = p.r * (small ? 1.1 : 0.5 + 0.5 * alpha);
      ctx.beginPath();
      ctx.moveTo(p.px, p.py);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    for (var j = rings.length - 1; j >= 0; j--) {
      var g = rings[j];
      g.r += small ? 12 : 16;
      g.life -= 0.045;
      if (g.life <= 0) { rings.splice(j, 1); continue; }
      ctx.globalAlpha = g.life * 0.55;
      ctx.strokeStyle = g.c;
      ctx.lineWidth = 4 * g.life + 1;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, 6.284);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    if (parts.length || rings.length) {
      requestAnimationFrame(tick);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  function shake(px) {
    if (calm || !document.body.animate) return;
    document.body.animate(
      [{ transform: "translate(0,0)" }, { transform: "translate(" + (-px) + "px," + (px * 0.7) + "px)" },
       { transform: "translate(" + (px * 0.85) + "px," + (-px * 0.55) + "px)" },
       { transform: "translate(" + (-px * 0.4) + "px," + (px * 0.3) + "px)" },
       { transform: "translate(0,0)" }],
      { duration: 340, easing: "ease-out" }
    );
  }

  function show() {
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight * (small ? 0.34 : 0.4);
    var k = small ? 0.55 : 1;

    flash.style.opacity = calm ? "0" : "1";
    setTimeout(function () { flash.style.opacity = "0"; }, 90);
    if (!calm) shake(small ? 3 : 7);

    burst(cx, cy, Math.round(320 * k), (small ? 11 : 15));
    setTimeout(function () { burst(cx - 170 * k, cy + 60 * k, Math.round(200 * k), (small ? 8 : 11)); }, 170);
    setTimeout(function () { burst(cx + 180 * k, cy - 40 * k, Math.round(200 * k), (small ? 8 : 11)); }, 330);
    setTimeout(function () { burst(cx, cy + 150 * k, Math.round(160 * k), (small ? 7 : 9)); }, 500);

    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  btn.style.touchAction = "manipulation";
  btn.addEventListener("click", function (e) { e.preventDefault(); show(); });

  var keys = "";
  window.addEventListener("keydown", function (e) {
    keys = (keys + e.key.toLowerCase()).slice(-3);
    if (keys === "www") show();
  });
})();
</script>

</body></html>
